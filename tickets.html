<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покупка и бронирование билетов - Путешествуйте выгодно</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4834d4;
            --accent: #00d2d3;
            --warning: #feca57;
            --dark: #222f3e;
            --light: #f1f2f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--light); color: var(--dark); }
        
        .labs-top-bar { background: #2d3436; padding: 4px 15px; text-align: right; font-size: 11px; }
        .labs-top-bar span { color: #b2bec3; margin-right: 8px; }
        .labs-top-bar a { color: #dfe6e9; text-decoration: none; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-left: 4px; }
        .labs-top-bar a:hover { background: rgba(255,255,255,0.25); color: white; }

        header { 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            color: white; 
            padding: 30px 20px 50px 20px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 32px; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 2px; }
        header p { font-size: 16px; margin: 0; opacity: 0.9; }

        .nav-container {
            max-width: 1100px;
            margin: -30px auto 30px auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 10;
        }
        .nav-card-btn {
            background: white;
            color: var(--dark);
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background 0.2s, color 0.2s;
        }
        .nav-card-btn:hover, .nav-card-btn.active { transform: translateY(-3px); background: var(--secondary); color: white; }

        .container { max-width: 950px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .tabs-header {
            display: flex;
            gap: 30px;
            border-bottom: 2px solid #e4e7eb;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }
        .tab-link {
            padding-bottom: 10px;
            color: #718093;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-link.active { color: var(--secondary); border-bottom-color: var(--secondary); }

        .search-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e4e7eb;
            margin-bottom: 30px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; color: #57606f; margin-bottom: 5px; }
        .form-control { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background: white; }
        
        .btn-submit {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-submit:hover { background: #3b2bc5; color: white; }

        footer { text-align: center; padding: 15px; background: var(--dark); color: white; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

<div class="labs-top-bar">
    <span>Лабораторные:</span>
    <a href="lab2.html">№2</a>
    <a href="lab3.html">№3</a>
    <a href="lab4.html">№4</a>
</div>

<header>
    <h1>Бронирование и покупка билетов</h1>
    <p>Оформление проездных документов онлайн</p>
</header>

<nav class="nav-container">
    <a href="index.html" class="nav-card-btn">🏠 Главная</a>
    <a href="transport.html" class="nav-card-btn">🚆 Транспорт</a>
    <a href="flights_plane.html" class="nav-card-btn">✈️ Рейсы</a>
    <a href="tickets.html" class="nav-card-btn active">🎟️ Билеты</a>
    <a href="customers.html" class="nav-card-btn">👤 Заказчики</a>
    <a href="search.html" class="nav-card-btn">🔍 Поиск</a>
    <a href="links.html" class="nav-card-btn">🔗 Ссылки</a>
    <a href="contacts.html" class="nav-card-btn">📞 Контакты</a>
</nav>

<div class="container">
    <div class="tabs-header">
        <span class="tab-link active">Поиск билетов</span>
    </div>

    <form action="tickets_register.html" method="GET">
        <div class="search-box">
            <div class="form-row">
                <div class="form-group">
                    <label>Вид транспорта</label>
                    <select class="form-control">
                        <option>✈️ Самолет</option>
                        <option>🚆 Поезд</option>
                        <option>🚌 Автобус</option>
                        <option>⚡ Электричка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Откуда</label>
                    <input type="text" class="form-control" value="Москва" required>
                </div>
                <div class="form-group">
                    <label>Куда</label>
                    <input type="text" class="form-control" placeholder="Санкт-Петербург" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Дата отправления</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пассажиры и класс</label>
                    <select class="form-control">
                        <option>1 пассажир, Эконом</option>
                        <option>1 пассажир, Бизнес</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">Найти билет и перейти к регистрации</button>
    </form>
</div>

<footer>
    <p>&copy; 2026 Система заказа билетов. Все права защищены.</p>
</footer>

</body>
</html>
