<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа № 2 - Каталог рейсов</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4834d4;
            --accent: #00d2d3;
            --warning: #feca57;
            --dark: #222f3e;
            --light: #f1f2f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--light); color: var(--dark); }
        
        .labs-top-bar { background: #2d3436; padding: 4px 15px; text-align: right; font-size: 11px; }
        .labs-top-bar span { color: #b2bec3; margin-right: 8px; }
        .labs-top-bar a { color: #dfe6e9; text-decoration: none; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-left: 4px; }
        .labs-top-bar a:hover { background: rgba(255,255,255,0.25); color: white; }

        header { 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            color: white; 
            padding: 30px 20px 50px 20px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 32px; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 2px; }
        header p { font-size: 16px; margin: 0; opacity: 0.9; }

        /* Адаптивное горизонтальное меню */
        .nav-container {
            max-width: 1150px;
            margin: -30px auto 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }
        .nav-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .menu-toggle {
            display: none;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            gap: 6px;
            padding: 10px 0;
        }
        .nav-card-btn {
            background: white;
            color: var(--dark);
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav-card-btn:hover, .nav-card-btn.active {
            background: var(--secondary);
            color: white;
            transform: translateY(-2px);
        }

        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { color: var(--secondary); font-size: 22px; border-bottom: 3px solid var(--warning); padding-bottom: 8px; display: inline-block; margin-top: 0; }

        .filter-form {
            background: #f8f9fa;
            border: 1px solid #e4e7eb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 13px; font-weight: 600; color: #57606f; margin-bottom: 5px; }
        .filter-control { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; }

        .schedule-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .schedule-table th, .schedule-table td { border: 1px solid #e4e7eb; padding: 12px; text-align: left; }
        .schedule-table th { background-color: var(--secondary); color: white; cursor: pointer; user-select: none; transition: background 0.2s; }
        .schedule-table th:hover { background-color: #3b2bc5; }
        .schedule-table tr:nth-child(even) { background-color: #f8f9fa; }
        .sort-hint { font-size: 11px; opacity: 0.8; margin-left: 5px; }

        footer { text-align: center; padding: 15px; background: var(--dark); color: white; margin-top: 40px; font-size: 13px; }

        /* Адаптивное сворачивание меню */
        @media (max-width: 1050px) {
            .menu-toggle { display: block; }
            .nav-wrapper { flex-direction: column; align-items: stretch; padding: 10px; }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                gap: 5px;
                padding-top: 10px;
            }
            .nav-links.show { display: flex; }
            .nav-card-btn { width: 100%; box-sizing: border-box; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="labs-top-bar">
    <span>Лабораторные:</span>
    <a href="lab2.html">№2</a>
    <a href="lab3.html">№3</a>
    <a href="lab4.html">№4</a>
</div>

<header>
    <h1>Лабораторная работа № 2</h1>
    <p>Каталог транспортных рейсов</p>
</header>

<nav class="nav-container">
    <div class="nav-wrapper">
        <button class="menu-toggle" onclick="toggleMenu()">≡ Меню навигации</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-card-btn">🏠 Главная</a>
            <a href="transport.html" class="nav-card-btn">🚆 Транспорт</a>
            <a href="flights_plane.html" class="nav-card-btn">✈️ Рейсы</a>
            <a href="tickets.html" class="nav-card-btn">🎟️ Билеты</a>
            <a href="customers.html" class="nav-card-btn">👤 Заказчики</a>
            <a href="search.html" class="nav-card-btn">🔍 Поиск</a>
            <a href="links.html" class="nav-card-btn">🔗 Ссылки</a>
            <a href="contacts.html" class="nav-card-btn">📞 Контакты</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Каталог транспортных рейсов</h2>
    
    <!-- Форма поиска, фильтрации и сортировки -->
    <div class="filter-form">
        <div class="filter-group">
            <label>Поиск по символам:</label>
            <input type="text" id="searchInput" class="filter-control" placeholder="Введите город, дату или цену..." oninput="processData()">
        </div>

        <div class="filter-group">
            <label>Вид транспорта:</label>
            <select id="transportFilter" class="filter-control" onchange="processData()">
                <option value="">-- Все виды --</option>
                <option value="Самолет">Самолет</option>
                <option value="Поезд">Поезд</option>
                <option value="Автобус">Автобус</option>
                <option value="Электричка">Электричка</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Сортировать по:</label>
            <select id="sortBy" class="filter-control" onchange="processData()">
                <option value="id">По умолчанию</option>
                <option value="date">Дата отправления</option>
                <option value="price">Цена</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Направление:</label>
            <select id="sortOrder" class="filter-control" onchange="processData()">
                <option value="asc">По возрастанию</option>
                <option value="desc">По убыванию</option>
            </select>
        </div>
    </div>

    <!-- Контейнер для таблицы -->
    <div id="tableContainer">Загрузка данных...</div>
</div>

<footer>
    <p>&copy; 2026 Система заказа билетов. Все права защищены.</p>
</footer>

<script>
const xmlString = `<?xml version="1.0" encoding="UTF-8"?>
<transport_catalog>
    <trip><id>1</id><transport_type>Самолет</transport_type><route>Москва — Санкт-Петербург</route><date>25.10.2026</date><price>4500</price></trip>
    <trip><id>2</id><transport_type>Поезд</transport_type><route>Москва — Нижний Новгород</route><date>23.10.2026</date><price>2100</price></trip>
    <trip><id>3</id><transport_type>Автобус</transport_type><route>Москва — Владимир</route><date>22.10.2026</date><price>950</price></trip>
    <trip><id>4</id><transport_type>Электричка</transport_type><route>Москва — Сергиев Посад</route><date>22.10.2026</date><price>350</price></trip>
    <trip><id>5</id><transport_type>Самолет</transport_type><route>Москва — Сочи</route><date>28.10.2026</date><price>7200</price></trip>
    <trip><id>6</id><transport_type>Поезд</transport_type><route>Москва — Казань</route><date>26.10.2026</date><price>3400</price></trip>
    <trip><id>7</id><transport_type>Автобус</transport_type><route>Москва — Ярославль</route><date>24.10.2026</date><price>1200</price></trip>
    <trip><id>8</id><transport_type>Самолет</transport_type><route>Москва — Екатеринбург</route><date>30.10.2026</date><price>6100</price></trip>
    <trip><id>9</id><transport_type>Поезд</transport_type><route>Москва — Санкт-Петербург</route><date>23.10.2026</date><price>2900</price></trip>
    <trip><id>10</id><transport_type>Электричка</transport_type><route>Москва — Тверь</route><date>22.10.2026</date><price>580</price></trip>
    <trip><id>11</id><transport_type>Автобус</transport_type><route>Москва — Тула</route><date>25.10.2026</date><price>850</price></trip>
    <trip><id>12</id><transport_type>Самолет</transport_type><route>Москва — Новосибирск</route><date>02.11.2026</date><price>11500</price></trip>
    <trip><id>13</id><transport_type>Поезд</transport_type><route>Москва — Самара</route><date>27.10.2026</date><price>3100</price></trip>
    <trip><id>14</id><transport_type>Электричка</transport_type><route>Москва — Рязань</route><date>22.10.2026</date><price>650</price></trip>
    <trip><id>15</id><transport_type>Самолет</transport_type><route>Москва — Калининград</route><date>29.10.2026</date><price>5400</price></trip>
    <trip><id>16</id><transport_type>Автобус</transport_type><route>Москва — Смоленск</route><date>26.10.2026</date><price>1400</price></trip>
</transport_catalog>`;

function toggleMenu() {
    let links = document.getElementById("navLinks");
    links.classList.toggle("show");
}

function sortByColumn(columnName) {
    let sortBySelect = document.getElementById("sortBy");
    let sortOrderSelect = document.getElementById("sortOrder");
    
    // Сортируем по клику на колонку, только если это доступные поля (id, date, price) или любые другие
    if (columnName === 'transport_type' || columnName === 'route') {
        columnName = 'id'; // Если кликнули по нефильтруемым колонкам, сбрасываем на id или обрабатываем как текст
    }

    if (sortBySelect.value === columnName) {
        sortOrderSelect.value = sortOrderSelect.value === "asc" ? "desc" : "asc";
    } else {
        sortBySelect.value = columnName;
        sortOrderSelect.value = "asc";
    }
    processData();
}

function processData() {
    try {
        let parser = new DOMParser();
        let xmlDoc = parser.parseFromString(xmlString, "text/xml");
        
        let trips = Array.from(xmlDoc.getElementsByTagName("trip"));
        
        let searchText = document.getElementById("searchInput").value.toLowerCase().trim();
        let filterType = document.getElementById("transportFilter").value;
        let sortBy = document.getElementById("sortBy").value;
        let sortOrder = document.getElementById("sortOrder").value;

        // 1. Поиск по символам
        if (searchText !== "") {
            trips = trips.filter(trip => {
                let id = trip.getElementsByTagName("id")[0].textContent.toLowerCase();
                let type = trip.getElementsByTagName("transport_type")[0].textContent.toLowerCase();
                let route = trip.getElementsByTagName("route")[0].textContent.toLowerCase();
                let date = trip.getElementsByTagName("date")[0].textContent.toLowerCase();
                let price = trip.getElementsByTagName("price")[0].textContent.toLowerCase();
                
                return id.includes(searchText) || 
                       type.includes(searchText) || 
                       route.includes(searchText) || 
                       date.includes(searchText) || 
                       price.includes(searchText);
            });
        }

        // 2. Фильтрация по транспорту
        if (filterType !== "") {
            trips = trips.filter(trip => {
                let type = trip.getElementsByTagName("transport_type")[0].textContent;
                return type === filterType;
            });
        }

        // 3. Сортировка данных
        trips.sort((a, b) => {
            let valA = a.getElementsByTagName(sortBy)[0].textContent;
            let valB = b.getElementsByTagName(sortBy)[0].textContent;

            if (sortBy === 'id' || sortBy === 'price') {
                valA = Number(valA);
                valB = Number(valB);
            } else if (sortBy === 'date') {
                let partsA = valA.split('.');
                let partsB = valB.split('.');
                valA = Number(partsA[2] + partsA[1] + partsA[0]);
                valB = Number(partsB[2] + partsB[1] + partsB[0]);
            }

            if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
            if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
            return 0;
        });

        // 4. Построение таблицы
        let html = `<table class="schedule-table">
            <thead>
                <tr>
                    <th onclick="sortByColumn('id')">№ <span class="sort-hint">↕</span></th>
                    <th>Вид транспорта</th>
                    <th>Маршрут</th>
                    <th onclick="sortByColumn('date')">Дата отправления <span class="sort-hint">↕</span></th>
                    <th onclick="sortByColumn('price')">Цена (руб.) <span class="sort-hint">↕</span></th>
                </tr>
            </thead>
            <tbody>`;

        if (trips.length === 0) {
            html += `<tr><td colspan="5" style="text-align:center;">По вашему запросу ничего не найдено</td></tr>`;
        } else {
            trips.forEach(trip => {
                let id = trip.getElementsByTagName("id")[0].textContent;
                let type = trip.getElementsByTagName("transport_type")[0].textContent;
                let route = trip.getElementsByTagName("route")[0].textContent;
                let date = trip.getElementsByTagName("date")[0].textContent;
                let price = trip.getElementsByTagName("price")[0].textContent;

                html += `<tr>
                    <td>${id}</td>
                    <td>${type}</td>
                    <td>${route}</td>
                    <td>${date}</td>
                    <td><strong>${price} ₽</strong></td>
                </tr>`;
            });
        }

        html += `</tbody></table>`;
        document.getElementById("tableContainer").innerHTML = html;

    } catch (error) {
        document.getElementById("tableContainer").innerHTML = "Ошибка обработки данных.";
        console.error(error);
    }
}

window.onload = processData;
</script>

</body>
</html>
